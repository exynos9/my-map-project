<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>주변 편의점 & 할인 정보</title>
    <script
      type="text/javascript"
      src="https://openapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=cc4n4apblb"
    ></script>
  </head>
  <body>
    <div class="main-container">
      <div id="map"></div>

      <div id="discount-tile" class="hidden">
        <div class="tile-header">
          <h3 id="tile-store-name">편의점 이름</h3>
          <button id="close-tile-btn">&times;</button>
        </div>
        <div id="tile-product-list"></div>
      </div>

      <div id="sidebar">
        <div class="sidebar-header">
          <h2>주변 편의점 목록</h2>
        </div>
        <ul id="store-list"></ul>
      </div>
    </div>

    <script>
      let map;
      let storeMarkers = [];
      let allDiscountEvents = []; // 깃허브에서 받아온 전체 할인 데이터 저장용

      // 1. 초기화: 지도 켜기 및 깃허브 할인 데이터 가져오기
      async function init() {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (position) => {
              loadNaverMap(position.coords.latitude, position.coords.longitude);
            },
            () => {
              loadNaverMap(37.5666805, 126.9784147);
            }, // 위치 실패 시 기본 서울시청
          );
        } else {
          loadNaverMap(37.5666805, 126.9784147);
        }

        // 지도 켜지면서 동시에 깃허브 JSON 파일 읽어오기
        await loadDiscountData();
      }

      // 2. 네이버 지도 로드 및 주변 검색 호출
      function loadNaverMap(lat, lng) {
        const userLocation = new naver.maps.LatLng(lat, lng);
        map = new naver.maps.Map("map", {
          center: userLocation,
          zoom: 16,
        });

        // 실시간 서버(Vercel) 호출
        fetchConvenienceStores();
      }

      // 3. 깃허브에서 할인 정보 받아오기
      async function loadDiscountData() {
        try {
          // 수정 전: const targetUrl = "https://raw.githubusercontent.com/...";
          // 수정 후: 내 Vercel 서버 엔드포인트 호출
          const response = await fetch("/api/discount");
          allDiscountEvents = await response.json();
        } catch (error) {
          console.error("할인 데이터 로드 실패:", error);
        }
      }

      // 4. 내 Vercel 백엔드 서버에서 편의점 위치 가져오기
      async function fetchConvenienceStores() {
        try {
          const response = await fetch("/api/search?query=편의점");
          const data = await response.json();

          if (data.items && data.items.length > 0) {
            displayStoreMarkers(data.items);
          }
        } catch (error) {
          console.error("편의점 위치 로드 실패:", error);
        }
      }

      // 5. 마커 찍기 및 오른쪽 리스트 생성 + 반투명 타일 연동
      function displayStoreMarkers(items) {
        const listEl = document.getElementById("store-list");
        listEl.innerHTML = "";

        storeMarkers.forEach((marker) => marker.setMap(null));
        storeMarkers = [];

        items.forEach((item) => {
          // TM128 좌표를 위경도로 변환
          const tm128 = new naver.maps.Point(
            Number(item.mapx),
            Number(item.mapy),
          );
          const latlng = naver.maps.TransCoord.fromTM128ToLatLng(tm128);
          const title = item.title.replace(/<[^>]*>?/gm, "");

          // 마커 생성
          const marker = new naver.maps.Marker({
            position: latlng,
            map: map,
            title: title,
          });

          // 오른쪽 사이드바에 들어갈 블록(li) 생성
          const listItem = document.createElement("li");
          listItem.className = "store-item";
          listItem.innerHTML = `
                <strong>${title}</strong>
                <span>${item.address}</span>
            `;

          // 블록이나 마커를 클릭했을 때 실행할 핵심 이벤트
          listItem.onclick = () => {
            document
              .querySelectorAll(".store-item")
              .forEach((li) => li.classList.remove("active"));
            listItem.classList.add("active");

            map.panTo(latlng); // 지도를 해당 편의점으로 부드럽게 이동
            showDiscountTile(title); // 왼쪽 반투명 타일에 할인 정보 띄우기
          };

          naver.maps.Event.addListener(marker, "click", () => {
            listItem.click();
          });

          listEl.appendChild(listItem);
          storeMarkers.push(marker);
        });
      }

      // 6. 반투명 타일에 할인 상품 뿌려주기
      function showDiscountTile(storeName) {
        const tile = document.getElementById("discount-tile");
        const tileTitle = document.getElementById("tile-store-name");
        const productList = document.getElementById("tile-product-list");

        // 이름에 따라 브랜드 필터링 기준 잡기
        let brand = "GS25";
        if (storeName.includes("CU") || storeName.includes("씨유"))
          brand = "CU";
        else if (storeName.includes("세븐일레븐")) brand = "SEVEN-ELEVEN";
        else if (storeName.includes("이마트24")) brand = "EMART24";

        tileTitle.innerText = `${storeName} 행사 상품`;
        productList.innerHTML = "";

        // 내 깃허브 JSON 배열에서 해당 브랜드 상품만 쏙 골라내기
        const filteredProducts = allDiscountEvents.filter(
          (item) => item.store.toUpperCase() === brand.toUpperCase(),
        );

        if (filteredProducts.length === 0) {
          productList.innerHTML =
            '<p style="grid-column: span 2; color:#999; text-align:center;">행사 정보가 없습니다.</p>';
        } else {
          filteredProducts.forEach((prod) => {
            const card = document.createElement("div");
            card.className = "product-card";
            card.innerHTML = `
                    <span class="badge-event">${prod.events[0] || "행사"}</span>
                    <img class="product-img" src="${prod.image_url}" onerror="this.src='https://via.placeholder.com/80?text=No+Image'" alt="${prod.name}">
                    <div class="product-name">${prod.name}</div>
                    <div class="price-info">
                        <span class="orig-price">${prod.original_price.toLocaleString()}원</span><br>
                        <span class="disc-price">${prod.price.toLocaleString()}원 (${prod.discount_rate})</span>
                    </div>
                `;
            productList.appendChild(card);
          });
        }

        tile.classList.remove("hidden"); // 반투명 타일 보이기
      }

      // X 버튼 누르면 반투명 타일 닫기
      document.getElementById("close-tile-btn").onclick = () => {
        document.getElementById("discount-tile").classList.add("hidden");
      };

      // 브라우저 켜지면 실행
      window.onload = init;
    </script>
  </body>
</html>
